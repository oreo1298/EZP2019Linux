[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezp2019linux"
dynamic = ["version"]
description = "Modern Linux software for the EZP2019/EZP2019+ USB SPI flash and EEPROM programmer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EZP2019Linux contributors" }]
keywords = ["ezp2019", "ezp2019+", "eeprom", "spi flash", "bios", "programmer", "usb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["pyusb>=1.2", "PySide6-Essentials>=6.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ezp2019linux = "ezp2019linux.cli:main"

[project.urls]
Homepage = "https://github.com/oreo1298/EZP2019Linux"

[tool.setuptools]
packages = ["ezp2019linux", "ezp2019linux.core", "ezp2019linux.data", "ezp2019linux.gui"]

[tool.setuptools.dynamic]
version = { attr = "ezp2019linux.__version__" }

[tool.setuptools.package-data]
"ezp2019linux.data" = ["*.json", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
